<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  /* 1. บังคับให้แถบเมนูด้านบน (Masthead) กว้างเท่ากับค่าที่คุณตั้ง */
  .masthead .wrapper {
    max-width: calc(100vw - 200px) !important;
    padding-left: 0 !important;   /* ลบขอบซ้ายที่เกินมา */
    padding-right: 0 !important;  /* ลบขอบขวาที่เกินมา */
    margin-left: auto !important; /* จัดกึ่งกลาง */
    margin-right: auto !important;
  }

  /* 2. บังคับให้เนื้อหาหลัก (Page Content) กว้างเท่ากัน */
  #main .wrapper {
    max-width: calc(100vw - 200px) !important;
    padding-left: 0 !important;
    padding-right: 0 !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }

  /* 3. (เสริม) จัดหัวข้อใหญ่ (H1) ให้ชิดซ้ายสุดขอบเขต */
  .page__inner-wrap {
    padding-left: 0 !important;
  }
</style>
